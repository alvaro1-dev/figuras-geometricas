<ion-card>
  <ion-card-header>
    <ion-card-title>Triángulo escaleno</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <p>El perímetro de un triángulo es la suma de las longitudes de sus tres lados.</p>
    <p class="formula">P = a + b + c</p>
    <ion-img src="assets/images/triangulo.svg" alt="Diagrama de un triángulo con tres lados distintos"></ion-img>
    <ion-item class="input-item">
      <ion-label position="stacked">Lado A (cm)</ion-label>
      <ion-input type="number" min="0" step="any" inputmode="decimal" [(ngModel)]="ladoA" placeholder="Ej.: 10"></ion-input>
    </ion-item>
    <ion-item class="input-item">
      <ion-label position="stacked">Lado B (cm)</ion-label>
      <ion-input type="number" min="0" step="any" inputmode="decimal" [(ngModel)]="ladoB" placeholder="Ej.: 20"></ion-input>
    </ion-item>
    <ion-item class="input-item">
      <ion-label position="stacked">Lado C (cm)</ion-label>
      <ion-input type="number" min="0" step="any" inputmode="decimal" [(ngModel)]="ladoC" placeholder="Ej.: 25"></ion-input>
    </ion-item>
    <ion-button expand="block" (click)="calcularPerimetro()">Calcular el perímetro</ion-button>
    <ion-text color="danger" *ngIf="error"><p class="message">{{ error }}</p></ion-text>
    <ion-text color="success" *ngIf="resultado !== null"><p class="result">El perímetro es {{ resultado | number:'1.2-2' }} cm</p></ion-text>
  </ion-card-content>
</ion-card>
