<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc">
<title id="title">Triángulo escaleno</title><desc id="desc">Un triángulo con tres lados de diferente longitud.</desc>
<polygon points="42,174 263,174 145,30" fill="#eee9ff" stroke="#6745c5" stroke-width="4" stroke-linejoin="round"/>
<text x="151" y="197" font-family="Arial, sans-serif" font-size="16" fill="#29344b">a</text>
<text x="79" y="97" font-family="Arial, sans-serif" font-size="16" fill="#29344b">b</text>
<text x="216" y="94" font-family="Arial, sans-serif" font-size="16" fill="#29344b">c</text>
<text x="160" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#29344b">Perímetro = a + b + c</text>
</svg>
